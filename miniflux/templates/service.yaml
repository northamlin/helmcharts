apiVersion: v1
kind: Service
metadata:
  name: {{ include "robots.fullname" . }}
  labels:
    {{- include "robots.labels" . | nindent 4 }}
  annotations:
    {{- include "robots.annotations" . | indent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "robots.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
