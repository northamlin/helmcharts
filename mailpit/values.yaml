# ─────────────────────────────────────────────────────────────────────────────
# Set by helmdeployer on every release (helmdeployer/src/generator.ts).
# Do not rename these; the defaults here only matter for `helm template` and tests.
# ─────────────────────────────────────────────────────────────────────────────
name: mailpit
uuid: dev00001
url: mailpit.eu-up.apps.robots.beer
replicaCount: 1
# low | medium | high | custom  (custom uses cpu/memory below as request AND limit)
resource: low
cpu: 100m
memory: 128Mi
# App data disk. UpCloud block storage will not bind anything below 10Gi.
storage: 10Gi
storageClass: standard
dbuser: app
dbname: app
dbpass: change-me-only-for-local-tests
hosting:
  tags: {}
# `image` is ALSO sent, but it holds the chart name, not an image. Never read it.

# ─────────────────────────────────────────────────────────────────────────────
# Chart-owned. helmdeployer does not send these, so the defaults are what runs.
# ─────────────────────────────────────────────────────────────────────────────
app:
  image: axllent/mailpit
  tag: "v1.33.0"
  port: 8025
  healthPath: /livez
  probe: http
  livenessProbe: ""
  startupFailureThreshold: 30
  command: []
  args: []
  # ADMIN_* come from secretEnv (listed first), so $(ADMIN_PASSWORD) expands here.
  env:
    MP_DATABASE: /data/mailpit.db
    MP_UI_AUTH: "$(ADMIN_USER):$(ADMIN_PASSWORD)"
    # SMTP (1025) is not exposed outside the pod network; require auth on it anyway.
    MP_SMTP_AUTH: "$(ADMIN_USER):$(ADMIN_PASSWORD)"
    MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    MP_DISABLE_VERSION_CHECK: "true"
    MP_MAX_MESSAGES: "1000"
  secretEnv:
    ADMIN_USER: username
    ADMIN_PASSWORD: password
  configFiles: []
  extraInitContainers: ""
  persistence:
    enabled: true
    mountPath: /data
  extraMounts: []
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

# The login the release is handed: username here, password = dbpass.
auth:
  username: admin

# none | mysql | postgres
database:
  type: none
  storage: 10Gi
  mysqlVersion: "8.0"
  postgresImage: ghcr.io/cloudnative-pg/postgresql:16

# Untiered helper containers (redis, workers).
appCpu: 50m
appMemory: 128Mi
appCpuLimit: 500m
appMemoryLimit: 512Mi

# The database. Keep dbMemoryLimit >= 512Mi for MySQL (buffer pool is sized from it).
dbCpu: 50m
dbMemory: 256Mi
dbCpuLimit: 500m
dbMemoryLimit: 768Mi

# Init containers, seed Jobs, exporters.
sidecarCpu: 10m
sidecarMemory: 32Mi
sidecarCpuLimit: 100m
sidecarMemoryLimit: 128Mi
