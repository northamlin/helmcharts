# Default values for wordpress.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1


uuid: hbdftsrfed
name: wordpress
image: wordpress
url: wordpress.eu-up.apps.robots.beer
version: 1

dbhost: mysql
dbuser: wordpress
dbpass: wordpress
dbname: wordpress
dbprefix: wp_
dburl: https://raw.githubusercontent.com/northamlin/helmcharts/master/dockers/sql-insert/db/wordpress.sql

wpuser: admin
wppass: admin

resource: low
#Only for custom
cpu: 100m
memory: 128Mi




storage: 10Gi
storageClass: standard

redis: false

hosting:
  tags:
    host/deployname: wordpress
    host/resources: low
    host/deploydate: date
    host/userid: userid
    host/id: idss

# Disk for the chart's own MysqlCluster.
dbStorage: 20Gi

# The chart's own MysqlCluster. Requests are what the scheduler reserves and what
# decides whether the pod fits; limits are the ceiling it may burst to.
dbCpu: 100m
dbMemory: 256Mi
dbCpuLimit: 500m
dbMemoryLimit: 768Mi
