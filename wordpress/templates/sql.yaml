apiVersion: mysql.presslabs.org/v1alpha1
kind: MysqlCluster
metadata:
  name: {{ .Values.name }}-{{ .Values.uuid }}
spec:
  replicas: 1
  secretName: {{ .Values.name }}-{{ .Values.uuid }}
  mysqlVersion: "8.0"
  podSpec:
    # Start small and grow. These are the mysql container only -- the operator's own
    # sidecar, metrics-exporter and pt-heartbeat carry their own defaults and are not
    # settable from here.
    #
    # The limit is not what decides whether a deployment fits on a node; the request
    # is. Raise dbCpu/dbMemory when a site is genuinely busy, not the limits.
    #
    # Do not take dbMemoryLimit below 512Mi: the operator sizes the InnoDB buffer pool
    # from the memory limit, and MySQL 8.0's own baseline puts it near that floor
    # already. Too low and the container OOMs on the first real query.
    resources:
      requests:
        cpu: {{ .Values.dbCpu }}
        memory: {{ .Values.dbMemory }}
      limits:
        cpu: {{ .Values.dbCpuLimit }}
        memory: {{ .Values.dbMemoryLimit }}
  volumeSpec:
    persistentVolumeClaim:
      accessModes: [ "ReadWriteOnce" ]
      # Without a class this lands on the cluster default -- upcloud-block-storage-maxiops
      # on eu-upcloud-1 -- and never on `standard`.
      storageClassName: {{ .Values.storageClass }}
      resources:
        requests:
          storage: {{ .Values.dbStorage }}
