apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    # A Job's pod template is immutable, so any change to this file -- adding resource
    # requests, bumping the seeder image -- makes ArgoCD try to patch a completed Job
    # and fail the whole sync, permanently.
    #
    # Force is not optional next to Replace. Replace on its own is `kubectl replace`,
    # which needs the selector and pod-template labels the Job controller generated at
    # creation time and which are not in this file, so it fails with
    # "spec.selector: Required value". Force makes it a delete-and-create.
    #
    # The seeder is idempotent -- it logs "We already have the database" -- so being
    # recreated when the spec changes costs a few seconds and nothing else.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
  name: sql-init-{{ .Values.name }}-{{ .Values.uuid }}
spec:
  template:
    spec:
      containers:
      - name: init-sql
        image: elino/sql-client
        resources:
          requests:
            cpu: {{ .Values.sidecarCpu }}
            memory: {{ .Values.sidecarMemory }}
          limits:
            cpu: {{ .Values.sidecarCpuLimit }}
            memory: {{ .Values.sidecarMemoryLimit }}
        env:
          - name: MYSQL_HOST
            value: {{ .Values.name }}-{{ .Values.uuid }}-mysql-master
          - name: MYSQL_USER
            valueFrom:
               secretKeyRef:
                 name: {{ .Values.name }}-{{ .Values.uuid }}
                 key: SQL_USER
          - name: MYSQL_PASSWORD
            valueFrom:
               secretKeyRef:
                 name: {{ .Values.name }}-{{ .Values.uuid }}
                 key: SQL_PASSWORD
          - name: MYSQL_DATABASE
            value: {{ .Values.dbname }}
          - name: MYSQL_DATAFILE_URL
            value: {{ .Values.dburl }}
          - name: MYSQL_ROOT_PASSWORD
            valueFrom:
               secretKeyRef:
                 name: {{ .Values.name }}-{{ .Values.uuid }}
                 key: ROOT_PASSWORD
      restartPolicy: Never

