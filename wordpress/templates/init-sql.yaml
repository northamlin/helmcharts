apiVersion: batch/v1
kind: Job
metadata:
  name: sql-init-{{ .Values.name }}-{{ .Values.uuid }}
spec:
  template:
    spec:
      containers:
      - name: init-sql
        image: elino/sql-client
        env:
          - name: MYSQL_HOST
            value: {{ .Values.name }}-{{ .Values.uuid }}-mysql-master
          - name: MYSQL_USER
            valueFrom:
               secretKeyRef:
                 name: {{ .Values.name }}-{{ .Values.uuid }}
                 key: SQL_USER
          - name: MYSQL_PASSWORD
            valueFrom:
               secretKeyRef:
                 name: {{ .Values.name }}-{{ .Values.uuid }}
                 key: SQL_PASSWORD
          - name: MYSQL_DATABASE
            value: {{ .Values.dbname }}
          - name: MYSQL_DATAFILE_URL
            value: {{ .Values.dburl }}
          - name: MYSQL_ROOT_PASSWORD
            valueFrom:
               secretKeyRef:
                 name: {{ .Values.name }}-{{ .Values.uuid }}
                 key: ROOT_PASSWORD
      restartPolicy: Never

