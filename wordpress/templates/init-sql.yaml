apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    # A Job's pod template is immutable, so any change to this file -- adding resource
    # requests, bumping the seeder image -- makes ArgoCD try to patch a completed Job
    # and fail the whole sync, permanently. Replace=true deletes and recreates it
    # instead. The seeder is idempotent ("We already have the database"), so a rerun on
    # the rare occasions the spec changes costs nothing.
    argocd.argoproj.io/sync-options: Replace=true
  name: sql-init-{{ .Values.name }}-{{ .Values.uuid }}
spec:
  template:
    spec:
      containers:
      - name: init-sql
        image: elino/sql-client
        resources:
          requests:
            cpu: {{ .Values.sidecarCpu }}
            memory: {{ .Values.sidecarMemory }}
          limits:
            cpu: {{ .Values.sidecarCpuLimit }}
            memory: {{ .Values.sidecarMemoryLimit }}
        env:
          - name: MYSQL_HOST
            value: {{ .Values.name }}-{{ .Values.uuid }}-mysql-master
          - name: MYSQL_USER
            valueFrom:
               secretKeyRef:
                 name: {{ .Values.name }}-{{ .Values.uuid }}
                 key: SQL_USER
          - name: MYSQL_PASSWORD
            valueFrom:
               secretKeyRef:
                 name: {{ .Values.name }}-{{ .Values.uuid }}
                 key: SQL_PASSWORD
          - name: MYSQL_DATABASE
            value: {{ .Values.dbname }}
          - name: MYSQL_DATAFILE_URL
            value: {{ .Values.dburl }}
          - name: MYSQL_ROOT_PASSWORD
            valueFrom:
               secretKeyRef:
                 name: {{ .Values.name }}-{{ .Values.uuid }}
                 key: ROOT_PASSWORD
      restartPolicy: Never

