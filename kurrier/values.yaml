# Default values for kurrier.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

uuid: hbdftsrfed
name: kurrier
url: mail.eu-up.apps.robots.beer

webImage: ghcr.io/kurrier-org/kurrier-web:v1.1.11
workerImage: ghcr.io/kurrier-org/kurrier-worker:v1.1.11

# PostgreSQL (CNPG)
dbuser: kurrier
dbpass: changeme
dbname: postgres
dbInstances: 1
dbStorage: 10Gi

# Redis
redisPassword: changeme

# Typesense
typesenseApiKey: changeme

# JWT / Auth
jwtSecret: your-super-secret-jwt-token-with-at-least-32-characters
jwtExpiry: 3600
anonKey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.changeme
serviceRoleKey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.changeme

# Application secrets
rlsClientPassword: changeme
secretKeyBase: changeme
vaultEncKey: changeme-min-32-characters-long!!
dashboardUsername: admin
dashboardPassword: changeme

adminEmail: admin@example.com
adminPassword: changeme

# Supabase
supabasePublicUrl: http://localhost:8000
siteUrl: http://localhost:3000

# SMTP for auth emails
smtpHost: smtp.example.com
smtpPort: "587"
smtpUser: ""
smtpPass: ""
smtpSenderName: Kurrier
smtpAdminEmail: admin@example.com

resource: low
#Only for custom
cpu: 100m
memory: 128Mi

storage: 10Gi
storageClass: standard

hosting:
  tags:
    host/deployname: kurrier
    host/resources: low
    host/deploydate: date
    host/userid: userid
    host/id: idss

# Supporting containers (redis, typesense, the mail workers, the in-chart app pods --
# anything without a low/medium/high tier). Requests are what the scheduler reserves,
# so keep them small; limits are the ceiling and exist so a container cannot be
# OOM-killed at a number nobody chose. These blocks previously declared a CPU request
# and nothing else, which left them BestEffort on memory -- first to be evicted, and
# free to balloon until they took the node with them.
appCpu: 50m
appMemory: 128Mi
appCpuLimit: 500m
appMemoryLimit: 512Mi
