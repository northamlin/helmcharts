{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Values.url }}"
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- range $key, $topping := (default dict (default dict .Values.hosting).tags) }}
    {{ $key }}: {{ $topping }}
    {{- end }}
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - {{ .Values.url }}
    secretName: {{ .Values.url }}
  rules:
    - host: {{ .Values.url }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}-{{ .Values.uuid }}
                port:
                  number: 80
{{- end }}
