apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    # A Job's pod template is immutable, so any change to this file -- adding resource
    # requests, bumping the seeder image -- makes ArgoCD try to patch a completed Job
    # and fail the whole sync, permanently. Replace=true deletes and recreates it
    # instead. The seeder is idempotent ("We already have the database"), so a rerun on
    # the rare occasions the spec changes costs nothing.
    argocd.argoproj.io/sync-options: Replace=true
  name: {{ .Values.name }}-{{ .Values.uuid }}-db-init
spec:
  template:
    spec:
      containers:
      - name: db-init
        image: mattiashem/init
        resources:
          requests:
            cpu: {{ .Values.sidecarCpu }}
            memory: {{ .Values.sidecarMemory }}
          limits:
            cpu: {{ .Values.sidecarCpuLimit }}
            memory: {{ .Values.sidecarMemoryLimit }}
        env:
          - name: DEST_DBPASS
            valueFrom:
              secretKeyRef:
                name: {{ .Values.name }}-{{ .Values.uuid }}
                key: SQL_PASSWORD
          - name: DEST_DBUSER
            valueFrom:
              secretKeyRef:
                name: {{ .Values.name }}-{{ .Values.uuid }}
                key: SQL_USER
          - name: DEST_DB
            valueFrom:
              secretKeyRef:
                name: {{ .Values.name }}-{{ .Values.uuid }}
                key: SQL_USER
          - name: DBHOST
            value: {{ .Values.name }}-{{ .Values.uuid }}-mysql-master
          - name: DBPORT
            value: "{{ .Values.dbport }}"
          - name: ROOT
            value: "root"
          - name: ROOTPASS
            valueFrom:
              secretKeyRef:
                name: {{ .Values.name }}-{{ .Values.uuid }}
                key: ROOT_PASSWORD
          - name: SEED_DB
            value: "{{ .Values.seed }}"
          - name: SEED_SOURCE
            value: "{{ .Values.seedSource }}"

      restartPolicy: Never