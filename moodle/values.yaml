# Default values for moodle.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
name: moodle
image: moodlehq/moodle-php-apache:8.2-bullseye
dbpass: password
proto: https
url: moodle.eu-up.apps.robots.beer
dbport: 3306
storage: 10Gi
dbuser: moodle
uuid: 12345

storageClass: standard
seedSource: https://storage.googleapis.com/elino-public-assets/sql/moodle/uggla_seed.sql
seed: "true"
cronSecret: moodle-cron

mysql-cluster:
  enabled: true
  mysqlRootPassword: ROOT_PASSWORD
  mysqlUser: moodle
  mysqlPassword: password
  mysqlDatabase: moodle

# The host, the Ingress name and the TLS secret name all come from the top-level
# `url` value -- the same convention every other chart in this repo uses, and the
# only value helmdeployer actually sets.
ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: http
    kubernetes.io/tls-acme: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure,web

service:
  annotations:
    norh/deployname: moodle
    norh/resources: low
    norh/deploydate: date
    norh/userid: userid
    norh/id: idss

hosting:
  tags:
    norh/deployname: moodle
    norh/resources: low
    norh/deploydate: date
    norh/userid: userid
    norh/id: idss

podAnnotations:
  norh/deployname: moodle
  norh/resources: low
  norh/deploydate: date
  norh/userid: userid
  norh/id: idss

resource: low
#Only for custom
cpu: 100m
memory: 128Mi

# Disk for the chart's own MysqlCluster.
dbStorage: 20Gi

# The chart's own MysqlCluster. Requests are what the scheduler reserves and what
# decides whether the pod fits; limits are the ceiling it may burst to.
dbCpu: 100m
dbMemory: 256Mi
dbCpuLimit: 500m
dbMemoryLimit: 768Mi

# Supporting containers (redis, typesense, the mail workers, the in-chart app pods --
# anything without a low/medium/high tier). Requests are what the scheduler reserves,
# so keep them small; limits are the ceiling and exist so a container cannot be
# OOM-killed at a number nobody chose. These blocks previously declared a CPU request
# and nothing else, which left them BestEffort on memory -- first to be evicted, and
# free to balloon until they took the node with them.
appCpu: 50m
appMemory: 128Mi
appCpuLimit: 500m
appMemoryLimit: 512Mi

# Sidecars and one-shot seed Jobs: the metrics exporter, the uggla sidecar, the SQL
# seeders. Tiny, but they still need a request the scheduler can see and a limit that
# is not left to chance.
sidecarCpu: 10m
sidecarMemory: 32Mi
sidecarCpuLimit: 100m
sidecarMemoryLimit: 128Mi
