replicaCount: 1

uuid: hbdftsrfed
name: matomo
image: matomo
url: matomo.eu-up.apps.robots.beer



# NOTE: this chart runs its own MySQL (templates/mysql.yaml) and the app addresses it
# at <name>-<uuid>-mysql, derived in the templates. `dbhost` is not read any more --
# run.robots.beer's deploy.js hardcodes it to "mysql", which was never a Service this
# chart created once the name was templated.
# dbhost: mysql
dbuser: matomo
dbpass: password
dbname: matomo

hosting:
  tags:
    host/deployname: matomo
    host/resources: low
    host/deploydate: date
    host/userid: userid
    host/id: idss

# The in-chart MySQL Deployment's disk. `standard` is the platform's UpCloud maxiops
# class on eu-upcloud-1; it is deliberately not the cluster default, so a claim that
# names nothing lands somewhere else.
storageClass: standard
dbStorage: 20Gi

# Supporting containers (redis, typesense, the mail workers, the in-chart app pods --
# anything without a low/medium/high tier). Requests are what the scheduler reserves,
# so keep them small; limits are the ceiling and exist so a container cannot be
# OOM-killed at a number nobody chose. These blocks previously declared a CPU request
# and nothing else, which left them BestEffort on memory -- first to be evicted, and
# free to balloon until they took the node with them.
appCpu: 50m
appMemory: 128Mi
appCpuLimit: 500m
appMemoryLimit: 512Mi

# The chart's own MySQL. Same split: small reservation, generous ceiling.
dbCpu: 50m
dbMemory: 256Mi
dbCpuLimit: 500m
dbMemoryLimit: 768Mi
